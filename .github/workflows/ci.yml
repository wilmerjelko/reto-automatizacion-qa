name: CI - Suites de Automatización QA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Playwright + Cucumber)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-frontend-playwright-cucumber
    env:
      # El sitio bajo prueba es público: un reintento absorbe la intermitencia de red.
      RETRY: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa-frontend-playwright-cucumber/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de UI
        run: npm run test

      - name: Generar reporte HTML
        if: always()
        run: npm run report

      - name: Publicar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-frontend
          path: qa-frontend-playwright-cucumber/reports/
          retention-days: 14

  backend:
    name: Backend (Karate DSL + JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-backend-karate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Ejecutar pruebas de API
        run: mvn -B clean test

      - name: Publicar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-backend
          path: qa-backend-karate/target/karate-reports/
          retention-days: 14
